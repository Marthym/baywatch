server {
    listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;
    http2   on;

    set $upstream http://baywatch:8081;
    set $imgproxystream http://imgproxy:8080;

    add_header Strict-Transport-Security "max-age=31536000" always;
    keepalive_timeout 15;

    location ~* \.(js|css|jpg|jpeg|png|gif|js|css|ico|swf)$ {
        try_files $uri $uri/ @proxycache;
    }
    
    location / {
        try_files $uri $uri/ @proxy;
    }

    location @proxy {
        limit_except GET PUT PATCH POST DELETE { deny all; }
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass $upstream;
    }

    location @proxycache {
        expires 1y;
        etag off;
        if_modified_since off;
        add_header Cache-Control "public, no-transform";
        
        limit_except GET PUT PATCH POST DELETE { deny all; }
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass $upstream;
    }

    location /api/sse {
        limit_except GET DELETE { deny all; }
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 12h;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass $upstream;
    }

    location /img {
        limit_except GET { deny all; }

        proxy_cache imgcache;
        proxy_cache_valid any 30d;
        proxy_cache_valid 404 1m;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass $imgproxystream;
    }

    location /otela {
        limit_except POST { deny all; }
        return 201;
    }
}
