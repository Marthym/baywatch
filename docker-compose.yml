---

volumes:
  prometheus_data: {}
  loki_data: {}
  grafana_data: {}

networks:
  bwnet:

services:

  baywatch:
    image: ghcr.io/marthym/baywatch:2.3.0-SNAPSHOT
    labels:
      application: baywatch
    read_only: true
    environment:
      BAYWATCH_DNS_SERVERS: 9.9.9.9, 8.8.8.8, 2620:fe::fe
      BAYWATCH_GRAPHQL_INTROSPECTION: true
      BAYWATCH_HOME: /var/lib/baywatch
      BAYWATCH_IMGPROXY_ENABLE: true
      BAYWATCH_IMGPROXY_SALT: "c20a3becb08164a79bffa4"
      BAYWATCH_IMGPROXY_SIGNKEY: "ad27d1a476e2d0f6326c76f275ed"
      BAYWATCH_LOG_LEVEL: DEBUG
      SPRING_MAIN_BANNER-MODE: off
      SPRING_PROFILES_ACTIVE: json-logging
    logging:
      options:
        labels: 'application'
        tag: 'id={{.ID}} name={{.Name}} image={{.ImageName}}'
    ports:
      - '8081:8081'
    networks:
      - bwnet
    volumes:
      - /home/marthym:/var/lib/baywatch
      - /tmp/baywatch:/tmp

  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v3.27.2
    restart: unless-stopped
    read_only: true
    labels:
      application: imgproxy
    logging:
      driver: json-file
      options:
        labels: 'application'
        tag: '{{ "id={{.ID}} name={{.Name}} image={{.ImageName}}" }}'
        max-size: '12m'
        max-file: '5'
    environment:
      IMGPROXY_ALLOW_ORIGIN: "*"
      IMGPROXY_COOKIE_PASSTHROUGH: true
      IMGPROXY_AUTO_AVIF: true
      IMGPROXY_ENFORCE_AVIF: true
      IMGPROXY_KEY: "ad27d1a476e2d0f6326c76f275ed"
      IMGPROXY_LOG_FORMAT: json #pretty
      IMGPROXY_LOG_LEVEL: info
      IMGPROXY_MAX_SRC_RESOLUTION: 20.5
      IMGPROXY_PATH_PREFIX: "/img"
      IMGPROXY_PRESETS: |
        desktop=resize:fill:240:238/ex:1/gravity:ce,
        mobile=resize:fill:268:96/ex:1/gravity:sm,
        icon=resize:fit:32:32
      IMGPROXY_SALT: "c20a3becb08164a79bffa4"
    ports:
      - "8082:8080"
    networks:
      - bwnet

  nginx:
    image: dhi.io/nginx:1.29.6-debian13-dev
    restart: unless-stopped
    read_only: true
    ports:
      - 80:80
    tmpfs:
      - /run/nginx:exec,mode=777,uid=1000,gid=1000
    volumes:
      - ./.compose/nginx/cache:/var/cache/nginx
      - ./.compose/nginx/data:/var/lib/data:ro
      - ./.compose/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./.compose/nginx/ssl:/etc/nginx/ssl:ro
    logging:
      driver: journald
      options:
        tag: 'nginx'
    networks:
      - bwnet

  prometheus:
    image: prom/prometheus:v3.9.1
    networks:
      - bwnet
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./.compose/prometheus/:/etc/prometheus/
      - prometheus_data:/prometheus

  loki:
    image: grafana/loki:3.6.5
    networks:
      - bwnet
    command:
      - -config.file=/etc/loki/local-config.yaml
      - -config.expand-env=true
    logging:
      driver: local
      options:
        max-size: 10m
    volumes:
      - loki_data:/loki

  grafana:
    image: grafana/grafana:12.3.3
    user: "472"
    depends_on:
      - prometheus
      - loki
    ports:
      - '3000:3000'
    networks:
      - bwnet
    environment:
      GF_SECURITY_ADMIN_USER: baywatch
      GF_SECURITY_ADMIN_PASSWORD: baywatch
      GF_USERS_ALLOW_SIGN_UP: false
    logging:
      driver: local
      options:
        max-size: 10m
    volumes:
      - grafana_data:/var/lib/grafana
      - ./.compose/grafana/provisioning/:/etc/grafana/provisioning/

  vector:
    image: dhi.io/vector:0.54.0-debian13-dev
    user: '0:0'
    read_only: true
    command: ['--config', '/etc/vector/*.toml']
    logging:
      driver: local
      options:
        max-size: 10m
    tmpfs:
      - /var/lib/vector:exec
    volumes:
      - './.compose/vector:/etc/vector:ro'
      - './.compose/vector/GeoLite2-City.mmdb:/var/lib/geoip/GeoLite2-City.mmdb:ro'
      - '/var/lib/docker/containers:/var/lib/docker/containers:ro'
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
      - '/:/rootfs:ro,rslave'
    networks:
      - bwnet